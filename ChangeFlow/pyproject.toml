[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "changeflow"
version = "0.1.0"
description = "Change request management API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0.40,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "workflow: workflow and state-transition behavior",
  "authorization: authentication and authorization behavior",
  "contract: HTTP contract behavior",
]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["changeflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jwt.*"]
ignore_missing_imports = true
